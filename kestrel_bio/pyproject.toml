# Standalone packaging config for publishing kestrel-bio to PyPI.
#
# Build and publish:
#   pip install build twine
#   python -m build
#   twine upload dist/*
#
# Or via trusted publisher (GitHub Actions / Zenodo CI):
#   See .github/workflows/publish.yml

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "kestrel-bio"
version = "1.0.0"
description = "Fast k-mer phylogenetic classifier — CPU-native companion to BiosphereAtlas"
readme = "../README.md"
license = {text = "MIT"}
authors = [
    {name = "Rohit Fenn", email = "rohit@sentry.bio"},
    {name = "Amit Fenn"},
]
keywords = [
    "bioinformatics",
    "metagenomics",
    "phylogenetics",
    "k-mer",
    "short-read classification",
    "Poincare ball",
    "hyperbolic geometry",
    "whole-genome sequencing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"

# Minimal deps — install in seconds on a lab server
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]
dev = [
    "pytest>=7",
    "httpx>=0.27",
]

[project.scripts]
kestrel = "kestrel_bio.cli:main"

[project.urls]
Homepage      = "https://biosphereatlas.com"
API           = "https://api.biosphereatlas.com/kestrel/docs"
"Source Code" = "https://github.com/sentrybi/kestrel"
"Bug Tracker" = "https://github.com/sentrybi/kestrel/issues"
"Zenodo"      = "https://doi.org/10.5281/zenodo.PENDING"

[tool.setuptools.packages.find]
where    = [".."]
include  = ["kestrel_bio*"]

[tool.setuptools.package-data]
kestrel_bio = ["py.typed"]
